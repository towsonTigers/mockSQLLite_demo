# Reusable: plan (and optionally apply) one Terraform environment.
#
# plan  - runs with the read-only plan role; posts the plan to the PR,
#         the job summary, and (on schedule) opens a drift issue.
# apply - runs in the GitHub environment (prod requires a reviewer), then
#         applies EXACTLY the saved plan from the plan job.

name: terraform-env

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      apply:
        type: boolean
        default: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "~1.11"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  plan:
    name: plan (${{ inputs.env }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.env }}
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          role-session-name: tf-plan-${{ inputs.env }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan: ${{ inputs.env }}"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          TF_ENV: ${{ inputs.env }}
          CHANGES: ${{ steps.plan.outputs.changes }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            const marker = `<!-- tfplan:${env} -->`;
            const plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');
            const body = [
              marker,
              `### Terraform plan: \`${env}\` ${process.env.CHANGES === 'true' ? '(changes)' : '(no changes)'}`,
              '<details><summary>Show plan</summary>', '', '```hcl',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated, see job summary)' : plan,
              '```', '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Open drift issue
        if: github.event_name == 'schedule' && steps.plan.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Terraform drift detected in ${{ inputs.env }} ($(date -u +%F))" \
            --body "Nightly plan found differences between code and AWS. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Save plan for apply
        if: inputs.apply && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}
          path: |
            infra/envs/${{ inputs.env }}/tfplan
            infra/envs/${{ inputs.env }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 3

  apply:
    name: apply (${{ inputs.env }})
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    concurrency:
      group: terraform-apply-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          role-session-name: tf-apply-${{ inputs.env }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}
          path: infra/envs/${{ inputs.env }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"

      - name: terraform apply (saved plan)
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Outputs
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
